<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ingredientes</title>
</head>

<body>

<h1>Ingredientes</h1>

<table border="1">

    <thead>

    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Unidad</th>
        <th>Estado</th>
    </tr>

    </thead>

    <tbody>

    <tr th:each="ingrediente : ${ingredientes}">

        <td th:text="${ingrediente.idIngrediente}"></td>

        <td th:text="${ingrediente.nombre}"></td>

        <td th:text="${ingrediente.categoria}"></td>

        <td th:text="${ingrediente.unidadMedida}"></td>

        <td th:text="${ingrediente.estado}"></td>

    </tr>

    </tbody>

</table>

</body>

</html>
