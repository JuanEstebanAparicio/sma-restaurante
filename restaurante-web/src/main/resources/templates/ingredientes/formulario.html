<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Nuevo Ingrediente</title>

</head>

<body>

<h1>Registrar Ingrediente</h1>

<form
        th:action="@{/ingredientes}"
        th:object="${ingrediente}"
        method="post">

    <p>
        Nombre:
        <input
                type="text"
                th:field="*{nombre}">
    </p>

    <p>
        Descripción:
        <input
                type="text"
                th:field="*{descripcion}">
    </p>

    <p>
        Categoría:
        <input
                type="text"
                th:field="*{categoria}">
    </p>

    <p>
        Unidad:
        <input
                type="text"
                th:field="*{unidadMedida}">
    </p>

    <p>
        Stock mínimo:
        <input
                type="number"
                step="0.01"
                th:field="*{stockMinimo}">
    </p>

    <p>
        Observaciones:
        <input
                type="text"
                th:field="*{observaciones}">
    </p>

    <button type="submit">

        Guardar

    </button>

</form>

</body>

</html>
